description: "Distribution Machine — FastAPI API + React Admin (clouapp/distributionmachine)."
dev_env_steps:
  - command: "bash .symphony/setup.sh"
    description: "API setup (venv, deps, alembic migrate)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "distributionmachine"
  - command: "bash .symphony/serve.sh"
    description: "FastAPI API server (uvicorn on $PORT, /api/health)"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/api/health"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/docs"
    working_dir: "distributionmachine"
  - command: "bash .symphony/setup.sh"
    description: "Admin setup (bun install + Playwright Chromium)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "distributionmachine/admin"
  - command: "bash .symphony/serve.sh"
    description: "React Admin dev (wire API, Vite on $PORT)"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "distributionmachine/admin"
kind: "symphony_project"
metadata:
  exported_at: "2026-06-17T12:00:00Z"
  source_project_slug: "distributionmachine"
name: "Distribution Machine"
repositories:
  - clone_url: "https://github.com/clouapp/distributionmachine.git"
    default_branch: "main"
    github_full_name: "clouapp/distributionmachine"
    role: "primary"
    selected_branch: "main"
    workspace_path: "distributionmachine"
setup:
  after_create_hook: |
    gh repo clone clouapp/distributionmachine distributionmachine -- --depth 1
  scan_summary:
    restored_from: "WORKFLOW.distributionmachine.md"
  validation_commands:
    - "cd distributionmachine && python -m pytest tests/test_modules.py"
    - "cd distributionmachine/admin && bun run test"
    - "cd distributionmachine/admin && bash .symphony/run-e2e.sh"
  workflow_markdown: |
    ---
    tracker:
      field_states:
        - Backlog
        - Planning
        - Todo
        - In Progress
        - Human Review
        - Rework
        - Merging
        - Done
        - Cancelled
        - Duplicate
      active_states:
        - Todo
        - In Progress
        - Rework
        - Merging
      dispatch_states:
        - Todo
        - Rework
      wait_states:
        - Human Review
      terminal_states:
        - Done
        - Cancelled
        - Duplicate
    polling:
      interval_ms: 5000
    assistant:
      # Draft issues created by the New issue assistant start here.
      draft_status: Planning
    editor:
      enabled: true
      binary: code-server
      host: 127.0.0.1
      port: 4003
      auth: none
    dev_server:
      enabled: true
      port_range: [4200, 4299]
      idle_timeout_ms: 1800000
      auto_start_on: pull_request,human_review
    evidence:
      required: true
      repos:
        admin:
          unit_command: "cd admin && bun run test"
          ui_paths:
            - "admin/src/**"
          e2e:
            command: "cd admin && bash .symphony/run-e2e.sh"
        distributionmachine:
          unit_command: "python -m pytest tests/test_modules.py"
          impacts:
            - admin
          contract_paths:
            - "api/**"
            - "src/**"
    pr_monitor:
      done_on_merge: true
      enabled: true
      max_auto_rework: 2
    source_control:
      branch_pattern: "symphony/{issue}"
      issue_marker_key: "Symphony-Issue"
      pr_title_pattern: "{issue}: {title}"
    # Public preview tunnel (Cloudflare). Same tracker tunnel domain as macro-markets.
    public_tunnel:
      enabled: true
      base_domain: tracker.cods.dev
      # namespace: raphaelcangucu   # defaults to the GitHub login when unset
    workspace:
      root: ~/code/distributionmachine-workspaces
    hooks:
      after_create: |
        gh repo clone clouapp/distributionmachine distributionmachine -- --depth 1
    agent:
      max_concurrent_agents: 5
      max_turns: 20
      completion_transitions:
        Todo: Human Review
        In Progress: Human Review
        Rework: Human Review
        Merging: Done
    codex:
      command: codex --config shell_environment_policy.inherit=all app-server
      approval_policy: never
      thread_sandbox: workspace-write
      turn_sandbox_policy:
        type: workspaceWrite
    claude:
      command: claude
    ---
    
    You are working on GitHub issue `{{ issue.identifier }}` in the **Distribution Machine** board (`clouapp/distributionmachine`).
    
    Read and follow **`AGENTS.md`** in the workspace root when present. If it is absent, follow the repository's README, Python packaging metadata, and local test conventions.
    
    Symphony injects **recent issue and PR comments** into your prompt when available. On **Rework**, those comments and the workpad define what you must do next.
    
    ## Repository
    
    This is a **single-repository** workspace for a Python standalone application.
    
    | Repo | Path | Integration branch | PR base |
    |------|------|--------------------|---------|
    | `clouapp/distributionmachine` | `distributionmachine/` | `main` | `main` |
    
    - Workspaces are cloned by `hooks.after_create` into `distributionmachine/`.
    - If the repository default branch is not `main`, update this workflow before dispatching work.
    - Before handoff, sync the repo with its integration branch:
      - `cd distributionmachine && git fetch origin && git merge origin/main`
    - Open PRs against the repo base:
      - `cd distributionmachine && gh pr create --base main --title "..."`
    - On **Rework**, sync with the integration branch and address feedback before pushing updates.
    
    ## Issue preview servers
    
    Symphony exposes a **Preview** tab when `dev_server.enabled` is true and DevEnv
    serve steps are saved for this project (imported via `distributionmachine-project.yaml`
    → `dev_env_steps`).
    
    ### Preview flow
    
    Symphony starts the **FastAPI API** first, then the **React Admin** (serve steps
    boot in declared order; admin waits for API `/api/health`). The admin Vite dev
    server proxies browser `/api` calls to the local API, so previews work behind a
    tunnel without exposing the API port directly.
    
    | Step order | Service | Target |
    |------------|---------|--------|
    | 1–2 | API setup + serve | FastAPI on `127.0.0.1` (`/api/health`, `/docs`) |
    | 3–4 | Admin setup + serve (primary) | Vite React Admin wired to local API |
    
    ### How to run each service (manual or Preview tab)
    
    **API — FastAPI (`distributionmachine/`)** — run first
    
    ```bash
    cd distributionmachine
    bash .symphony/setup.sh
    PORT=5000 bash .symphony/serve.sh
    # Health: http://127.0.0.1:5000/api/health
    # Docs:   http://127.0.0.1:5000/docs
    ```
    
    **Admin — React/Vite (`distributionmachine/admin/`)** — after API is healthy
    
    ```bash
    cd distributionmachine/admin
    bash .symphony/setup.sh
    PORT=5173 bash .symphony/serve.sh
    # UI:     http://127.0.0.1:5173/
    # Health: http://127.0.0.1:5173/api/health  (proxied to API)
    ```
    
    - Scripts ship under `distributionmachine/.symphony/` and `distributionmachine/admin/.symphony/`.
    - Setup runs `alembic upgrade head` (seeds default admin `admin@distributionmachine.local` / `changeme123`).
    - Admin wiring is local-only: if the API is unhealthy, `wire-services.sh` fails fast.
    - Local dev (outside Symphony): `make dev` from repo root starts both servers.
    
    ### Saved DevEnv steps (imported)
    
    | Step | Role | Dir | Command |
    |------|------|-----|---------|
    | API setup | setup | `distributionmachine/` | `bash .symphony/setup.sh` |
    | FastAPI server | serve | `distributionmachine/` | `bash .symphony/serve.sh` |
    | Admin setup | setup | `distributionmachine/admin/` | `bash .symphony/setup.sh` |
    | React Admin dev | serve (primary) | `distributionmachine/admin/` | `bash .symphony/serve.sh` |
    
    ## Python standalone conventions
    
    - Prefer the repository's existing package manager and commands. Check, in order:
      - `pyproject.toml`
      - `setup.py`
      - `requirements*.txt`
      - `Makefile`
      - `README.md`
    - Keep changes scoped to the standalone runtime, packaging, CLI/config handling, tests, and documentation needed by the issue.
    - Do not introduce a new framework, service layer, or packaging tool unless the issue explicitly requires it or the repo already uses it.
    - Preserve command-line behavior and existing config/environment semantics unless the issue asks for a breaking change.
    
    ## Agent routing (GitHub labels)
    
    | Label | Agent |
    |-------|--------|
    | `symphony:codex` | Codex |
    | `symphony:claude` | Claude |
    | `symphony` | Default (**Codex** when this WORKFLOW includes `codex:`) |
    
    Symphony only dispatches issues whose label resolves to an agent configured above.
    
    Symphony reads and updates the GitHub Project **Status** field when moving cards.
    
    | State | Role |
    |-------|------|
    | Backlog | Intake; not ready for planning |
    | Planning | Human planning with the issue assistant — create spec, plan, and handoff docs; do not dispatch agent runs |
    | Todo | Orchestrator queue; move to In Progress before work |
    | In Progress | Active implementation |
    | Human Review | PR ready; poll for human decision; no further coding turns |
    | Rework | Address review feedback |
    | Merging | Merge only after review approval and green validation |
    | Done / Cancelled / Duplicate | Terminal |
    
    Use a single `## Codex Workpad` comment for progress. Blockers: `Blocked by #N` or `Depends on clouapp/distributionmachine#N`.
    
    ## Assistant authoring handoff
    
    The tracker **New issue** button opens the issue authoring assistant by default. It creates a draft in `assistant.draft_status` (**Planning**), then continues at `/projects/:slug/assistant/issue/:id`.
    
    Use **Planning** to discuss the task and produce spec, plan, and handoff artifacts when needed. Move to **Todo** only when the issue is ready for agent execution.
    
    Before execution, read any generated specs, plans, handoff notes, issue comments, and linked PR comments when present. The Agent tab separates **Authoring** from **Execution**.
    
    ## Rework flow (required)
    
    When the Project **Status** is **Rework**:
    
    1. Read all feedback before editing code:
       - Injected **Recent discussion** section in this prompt.
       - `gh issue view <number> --comments` for the full issue thread.
       - `gh pr view` and `gh pr view --comments` for the open PR tied to this work, if any.
       - Inline review threads on the PR through GitHub UI, `gh api`, or `github_graphql`.
    2. Find or create the `## Codex Workpad` comment. Summarize human feedback into **Acceptance criteria** and a short **Rework plan** before implementation.
    3. Sync the branch:
       - `cd distributionmachine && git fetch origin && git merge origin/main`
    4. Implement fixes; add or update focused tests.
    5. Push and update the PR against `main`; record validation results in the workpad.
    6. Move to **Human Review** only when feedback is addressed and tests are green.
    
    Do not ignore human comments that only appear on the PR; they are part of the rework scope.
    
    ## Tests and validation (mandatory)
    
    Symphony does **not** run the test suite automatically. Validate before **Human Review**.
    Follow `.codex/skills/evidence/SKILL.md` during the VALIDATE stage — write
    `.symphony/evidence/manifest.json` with real artifacts before handoff.
    
    - Treat ticket `Validation`, `Test Plan`, or `Testing` sections as required; mirror them in the workpad.
    - **API / Python (`distributionmachine/`)** — when you changed backend code:
      - Scoped unit: `cd distributionmachine && python -m pytest tests/test_modules.py` (or a path matching your diff)
      - Lint (when touched): `cd distributionmachine && make lint` or `ruff check <changed-paths>`
      - Do **not** run the full pytest suite unless the ticket requires it — CI owns regression.
    - **Admin UI (`distributionmachine/admin/`)** — when you changed frontend code:
      - Scoped unit: `cd distributionmachine/admin && bun run test -- src/...` (mirror changed paths)
      - Lint changed paths: `cd distributionmachine/admin && bun run lint -- <paths-from-git-diff>`
      - **E2E (Playwright)** — required when UI paths change (`admin/src/**`):
        - `cd distributionmachine/admin && bash .symphony/run-e2e.sh e2e/<affected-flow>.spec.js`
        - Playwright captures screenshot, video, and trace (see `admin/playwright.config.js`).
        - Default login: `admin@distributionmachine.local` / `changeme123`
    - **Cross-repo impact**: API changes under `api/**` or `src/**` can affect the admin UI.
      Either run admin Playwright for the impacted flow or record `impacts_ui: false` with rationale in the manifest.
    - Record in workpad **Validation**: `targeted tests: <command>` and outcome.
    - Do **not** move to **Human Review** until:
      - Acceptance criteria are met
      - Scoped tests pass for the latest commit
      - Evidence manifest is present when `evidence.required` is true
      - A PR is open against `main`, linked on the issue, with checks green where applicable
    - In **Human Review**, do not implement; wait and poll for human feedback.
