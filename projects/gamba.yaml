description: "Gamba workspace — frontend (GambaLabs/frontend) + backend (GambaLabs/backend) + goapi (GambaLabs/goapi)."
dev_env_steps:
  # --- Backend (Laravel Sail / Vibe) — must start before frontend ---
  - command: "bash .symphony/setup.sh"
    description: "Backend setup (vibe shared up + composer bootstrap + sail build)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "symphony-preview-runner"
    description: "Backend Laravel API (vibe up + bootstrap)"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/health"
    ready_probe: "http"
    role: "serve"
    run_spec:
      cwd: "backend"
      prepare:
        - ["bash", ".symphony/setup.sh"]
      start:
        - ["bash", "-lc", "export APP_PORT=${PORT:-$APP_PORT}; ./vibe up && ./vibe bootstrap && docker logs -f betting-app"]
      health:
        path: "/health"
        timeout_ms: 180000
      stop:
        command: ["bash", "-lc", "./vibe down || true"]
    source: "manual"
    url_path: "/graphiql"
    working_dir: "backend"
  # --- GoAPI (Go) — must start before frontend (in-house games) ---
  - command: "bash .symphony/setup.sh"
    description: "GoAPI setup (.env + build-local + APP_KEY sync)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "goapi"
  - command: "symphony-preview-runner"
    description: "GoAPI GraphQL server (waits for backend, then runs local binary)"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/graphiql"
    ready_probe: "http"
    role: "serve"
    run_spec:
      cwd: "goapi"
      prepare:
        - ["bash", ".symphony/setup.sh"]
      start:
        - ["make", "build-local"]
        - ["./bin/server"]
      health:
        path: "/graphiql"
        timeout_ms: 60000
    source: "manual"
    url_path: "/graphiql"
    working_dir: "goapi"
  # --- Frontend (Nuxt) — wired to backend + GoAPI after both are healthy ---
  - command: "bash .symphony/setup.sh"
    description: "Frontend setup (.env.local + yarn install)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "frontend"
  - command: "symphony-preview-runner"
    description: "Frontend Nuxt dev (wire backend + GoAPI, then serve)"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/api/health"
    ready_probe: "http"
    role: "serve"
    run_spec:
      cwd: "frontend"
      prepare:
        - ["bash", ".symphony/setup.sh"]
        - ["bash", ".symphony/wire-services.sh"]
      start:
        - ["node", "scripts/generate-version.cjs"]
        - ["./node_modules/.bin/nuxi", "dev", "--dotenv", ".env.local", "--host", "0.0.0.0", "--port", "${PORT}"]
      health:
        path: "/api/health"
        timeout_ms: 120000
    source: "manual"
    url_path: "/"
    working_dir: "frontend"
kind: "symphony_project"
metadata:
  exported_at: "2026-06-11T19:57:27Z"
  source_project_slug: "gamba"
name: "Gamba"
repositories:
  - clone_url: "https://github.com/GambaLabs/backend.git"
    default_branch: "dev"
    github_full_name: "GambaLabs/backend"
    role: "backend"
    selected_branch: "dev"
    workspace_path: "backend"
  - clone_url: "https://github.com/GambaLabs/frontend.git"
    default_branch: "development"
    github_full_name: "GambaLabs/frontend"
    role: "primary"
    selected_branch: "development"
    workspace_path: "frontend"
  - clone_url: "https://github.com/GambaLabs/goapi.git"
    default_branch: "dev"
    github_full_name: "GambaLabs/goapi"
    role: "service"
    selected_branch: "dev"
    workspace_path: "goapi"
setup:
  validation_commands:

  workflow_markdown: |
    ---
    agent:
      completion_transitions:
        In Progress: Human Review
        Merging: Done
        Rework: Human Review
        Todo: Human Review
      max_concurrent_agents: 5
      max_turns: 40
    assistant:
      draft_status: Planning
    claude:
      command: symphony-claude
    codex:
      goals_enabled: true
      approval_policy: never
      command: codex --config shell_environment_policy.inherit=all app-server
      thread_sandbox: danger-full-access
      turn_sandbox_policy:
        type: dangerFullAccess
    dev_server:
      enabled: true
      idle_timeout_ms: 1800000
      port_range:
        - 4100
        - 4199
      runtime_contract_v1: true
    evidence:
      required: true
      repos:
        frontend:
          unit_command: "yarn test --run"
          ui_paths:
            - "src/**"
          e2e:
            command: "npx playwright test"
        backend:
          unit_command: "./vibe test"
          impacts:
            - "frontend"
          contract_paths:
            - "app/Http/**"
            - "routes/**"
            - "graphql/**"
            - "app/GraphQL/**"
        goapi:
          unit_command: "go test ./..."
          impacts:
            - "frontend"
          contract_paths:
            - "**/*.proto"
            - "internal/handler/**"
            - "internal/handlers/**"
            - "openapi*.y*ml"
    hooks:
      after_create: |
        gh repo clone GambaLabs/frontend frontend -- --depth 1 -b development
        gh repo clone GambaLabs/backend backend -- --depth 1 -b dev
        gh repo clone GambaLabs/goapi goapi -- --depth 1 -b dev

        if [ -f frontend/.env.example ]; then
          cp frontend/.env.example frontend/.env
          cp frontend/.env.example frontend/.env.local
        else
          touch frontend/.env frontend/.env.local
        fi

        if [ -f backend/.env.example ] && [ ! -f backend/.env ]; then
          cp backend/.env.example backend/.env
        fi

        if [ -f goapi/.env.example ] && [ ! -f goapi/.env ]; then
          cp goapi/.env.example goapi/.env
        fi

        cat >> frontend/.env.local <<ENV

        # Symphony local/dev override for Nuxt/Vue frontend
        NODE_ENV=development
        NUXT_TELEMETRY_DISABLED=1
        APP_ENV=dev
        NUXT_PUBLIC_APP_ENV=dev
        ENV
    pr_monitor:
      done_on_merge: true
      enabled: true
      max_auto_rework: 2
    source_control:
      branch_pattern: "symphony/{issue}"
      pr_title_pattern: "{issue}: {title}"
      issue_marker_key: "Symphony-Issue"
    public_tunnel:
      base_domain: tracker.cods.dev
      enabled: true
    repositories:
      - github_full_name: GambaLabs/frontend
        role: primary
        selected_branch: development
        workspace_path: frontend
      - github_full_name: GambaLabs/backend
        role: backend
        selected_branch: dev
        workspace_path: backend
      - github_full_name: GambaLabs/goapi
        role: service
        selected_branch: dev
        workspace_path: goapi
    tracker:
      active_states:
        - Todo
        - In Progress
        - Human Review
        - Rework
        - Merging
      dispatch_states:
        - Todo
      field_states:
        - Backlog
        - Planning
        - Todo
        - In Progress
        - Human Review
        - Rework
        - Merging
        - Done
        - Cancelled
        - Duplicate
      terminal_states:
        - Done
        - Cancelled
        - Duplicate
      wait_states:
        - Human Review
    workspace:
      root: ~/code/gamba-workspaces
    ---

    You are working on issue `{{ issue.identifier }}` in the **Gamba** board.

    **Canonical issue (source of truth):** {{ issue.url }}

    The owning GitHub repository is determined by that URL (e.g. `GambaLabs/backend` or `GambaLabs/frontend`).
    Do **not** assume every issue lives in `GambaLabs/frontend` — the board aggregates issues from multiple repos.

    Read and follow **`AGENTS.md`** in the workspace root and each repository's local guidance when present.

    Symphony injects **recent issue and PR comments** into your prompt when available. On **Rework**, those comments and the workpad define what you must do next.

    ## Tracker / issue metadata (local-first)

    - Use Symphony's issue-bound tools first: `set_issue_status`, `list_comments`, `add_comment`, `update_comment`.
    - Title, description, and synced comments come from the local tracker mirror — do not re-fetch the issue from GitHub MCP unless local data is missing or stale.
    - If you need the GitHub repo for an API call, derive it from `{{ issue.url }}`, not from `tracker.config.repo` or this workflow file.

    ## Creating tasks (multi-repo)

    Before `create_issue` / `create_draft_issue`, call `list_project_repositories` and pass **`repository: "owner/name"`** for the repo that owns the work:

    | Work type | Repository |
    |-----------|------------|
    | Vue/Nuxt frontend | `GambaLabs/frontend` |
    | Laravel backend | `GambaLabs/backend` |
    | Go GraphQL (in-house games) | `GambaLabs/goapi` |

    Do not file backend or goapi tasks in `GambaLabs/frontend` — Symphony creates issues in `tracker.config.repo` unless `repository` is set.

    ## Repositories

    This is a **multi-repository** workspace on a single GitHub Project. Each issue has its own canonical URL (`{{ issue.url }}`) pointing to the repo where it was filed (frontend, backend, or another linked repo). Implementation may still touch frontend, backend, goapi, or any combination.

    | Repo | Path | Integration branch | PR base |
    |------|------|--------------------|---------|
    | `GambaLabs/frontend` (Vue/Nuxt frontend) | `frontend/` | `development` | `development` |
    | `GambaLabs/backend` (backend) | `backend/` | `dev` | `dev` |
    | `GambaLabs/goapi` (goapi) | `goapi/` | `dev` | `dev` |

    - Workspaces are cloned by `hooks.after_create` into `frontend/`, `backend/`, and `goapi/`.
    - The frontend is Vue/Nuxt, not Next. Do not copy assumptions from the Macro Markets frontend without checking Gamba's files first.
    - The frontend env is based on `frontend/.env.example`, written to both `frontend/.env` and `frontend/.env.local`; Symphony appends base dev flags on clone. The Preview runner wires `frontend/.env.local` to the local backend after `/health` passes.
    - Before handoff, sync each repo you touched with its integration branch:
      - frontend: `cd frontend && git fetch origin && git merge origin/development`
      - backend: `cd backend && git fetch origin && git merge origin/dev`
      - goapi: `cd goapi && git fetch origin && git merge origin/dev`
    - Open PRs **per repo against that repo's base**:
      - frontend: `cd frontend && gh pr create --base development --title "..."`
      - backend: `cd backend && gh pr create --base dev --title "..."`
      - goapi: `cd goapi && gh pr create --base dev --title "..."`
    - **Every PR body MUST include the association marker on its own line** so Symphony can link the PR to this issue deterministically: `Symphony-Issue: {{ issue.identifier }}`
    - Keep the machine-readable PR registry block in the `## Codex Workpad` comment updated with every PR you open (one item per PR, with repo, number, branch, url):
      ```
      <!-- symphony:prs
      - repo: GambaLabs/frontend
        number: 1866
        branch: symphony/{{ issue.identifier }}
        url: https://github.com/GambaLabs/frontend/pull/1866
      -->
      ```
    - On **Rework**, sync with the right integration branch per repo and address all issue comments, PR comments, and inline review threads.
    - Follow each repo's own test, lint, Docker/Sail/Vibe, and PR template conventions. Prefer repository-provided wrappers over bare tool invocations.

    ## Issue preview servers

    Symphony exposes a **Preview** tab when `dev_server.enabled` is true and DevEnv serve steps are saved for this project (imported via `gamba.yaml` → `dev_env_steps`).

    ### Preview flow

    Symphony starts **backend**, then **GoAPI**, then **frontend**. The frontend
    runner waits for backend `/health` and GoAPI `/graphiql`, writes local API
    URLs to `.env.local`, then starts Nuxt.

    | Step order | Service | API target |
    |------------|---------|------------|
    | 1–2 | Backend setup + serve | Local Laravel (GraphiQL + `/health`) |
    | 3–4 | GoAPI setup + serve | Local Go GraphQL (`/graphiql`, `/graphql`) |
    | 5–6 | Frontend setup + serve | Wired to backend + GoAPI on `127.0.0.1` |

    ### How to run each service (manual or Preview tab)

    **Backend — Laravel Sail / Vibe (`backend/`)** — run first

    ```bash
    cd backend
    bash .symphony/setup.sh
    export PORT="${PORT:-4100}"
    export APP_PORT="$PORT"
    ./vibe up
    ./vibe bootstrap
    docker logs -f betting-app
    # GraphiQL: http://127.0.0.1:<PORT>/graphiql
    # Health:   http://127.0.0.1:<PORT>/health
    ```

    **GoAPI — Go (`goapi/`)** — after backend is healthy

    ```bash
    cd goapi
    export PORT="${PORT:-4101}"
    bash .symphony/setup.sh
    make build-local
    ./bin/server
    # GraphiQL: http://127.0.0.1:<PORT>/graphiql
    # GraphQL:  http://127.0.0.1:<PORT>/graphql
    ```

    **Frontend — Nuxt (`frontend/`)** — after backend and GoAPI are healthy

    ```bash
    cd frontend
    bash .symphony/setup.sh
    bash .symphony/wire-services.sh
    node scripts/generate-version.cjs
    nuxi dev --dotenv .env.local --host 0.0.0.0 --port "$PORT"
    # Health: http://127.0.0.1:<PORT>/api/health
    ```

    - Backend, GoAPI, and frontend `serve.sh` files are fail-fast legacy stubs; Symphony launches their `run_spec` definitions with `symphony-preview-runner`.
    - Scripts ship under `frontend/.symphony/`, `backend/.symphony/`, and `goapi/.symphony/`
    - Validation: `yarn lint` / `yarn test` (frontend), `./vibe test` (backend)

    Feature-branch isolation (optional, outside Symphony preview):

    ```bash
    ./vibe create branch=feature/slug
    cd ../vibe-feature-slug
    ./vibe up -d
    ./vibe artisan migrate --seed
    ```

    Prefer `./vibe` / `./vendor/bin/sail` over bare `php` or `artisan`. Validation: `./vendor/bin/sail pest` (or `./vibe test`).

    **GoAPI — Go (`goapi/`)**

    Prerequisites: Go ≥ 1.23.5, shared Postgres/Redis from backend Sail (`localhost:5432`, `localhost:6379`).
    Prefer **Makefile targets** over raw `go` commands (see `goapi/Makefile`).

    Symphony Preview uses `goapi/.symphony/` scripts instead of raw `make run-local`.

    Other useful Makefile targets:

    | Target | Purpose |
    |--------|---------|
    | `make run-local` | Start GraphQL server locally |
    | `make restart-local` | Kill process on :8091 and restart |
    | `make build-local` | Build `bin/server` |
    | `make test` | Run full test suite (`go test ./... -v`) |
    | `make test-smart` | Run tests with gotestsum (if installed) |
    | `make test-coverage` | Coverage report |
    | `make run-lambda-local` | SAM local API (Lambda path; needs SAM CLI) |

    Validation: `make test` (or `make test-smart` when gotestsum is available).

    ### Full-stack preview wiring

    Automatic: the frontend runner calls `frontend/.symphony/wire-services.sh`,
    which polls `backend/.symphony/verify-health.sh` and
    `goapi/.symphony/verify-health.sh`, then sets:

    ```
    GRAPHQL_BASE_URL=http://127.0.0.1:<backend-port>
    INHOUSE_API_ENABLED=true
    GRAPHQL_INHOUSE_URL=http://127.0.0.1:<goapi-port>/graphql
    INHOUSE_PROXY_PATH=/_goapi
    ```

    ### Saved DevEnv steps (imported)

    | Step | Role | Dir | Command |
    |------|------|-----|---------|
    | Backend setup | setup | `backend/` | `bash .symphony/setup.sh` |
    | Laravel API | serve | `backend/` | `symphony-preview-runner` |
    | GoAPI setup | setup | `goapi/` | `bash .symphony/setup.sh` |
    | GoAPI server | serve | `goapi/` | `symphony-preview-runner` |
    | Frontend setup | setup | `frontend/` | `bash .symphony/setup.sh` |
    | Nuxt dev server | serve (primary) | `frontend/` | `symphony-preview-runner` |

    Setup steps for the same `working_dir` run automatically before their serve step. Optional steps are skipped on failure.

    Repositories may also declare steps in `.symphony/devenv.yaml` for DevEnv discovery; imported project steps take precedence after import.

    ## Agent routing (GitHub labels)

    | Label | Agent |
    |-------|--------|
    | `symphony:codex` | Codex |
    | `symphony:claude` | Claude |
    | `symphony` | Default (**Codex** when this WORKFLOW includes `codex:`) |

    Symphony only dispatches issues whose label resolves to an agent configured above.

    Symphony reads and updates the GitHub Project **Status** field when moving cards.

    | State | Role |
    |-------|------|
    | Backlog | Intake; not ready for planning |
    | Planning | Human planning with the issue assistant — create spec, plan, and handoff docs; do not dispatch agent runs |
    | Todo | Orchestrator queue; move to In Progress before work |
    | In Progress | Active implementation |
    | Human Review | PR ready; poll for human decision; no further coding turns |
    | Rework | Address review feedback |
    | Merging | Merge approved PRs using the correct base per repo |
    | Done / Cancelled / Duplicate | Terminal |

    Use a single `## Codex Workpad` comment for progress. Blockers: `Blocked by #N` or `Depends on <owner>/<repo>#N` (use the target issue's canonical URL/repo, not a hardcoded frontend reference).

    Raw GitHub GraphQL: `github_graphql`.

    ## Assistant authoring handoff

    The tracker **New issue** button opens the issue authoring assistant by default. It creates a draft in `assistant.draft_status` (**Planning**), then continues at `/projects/:slug/assistant/issue/:id`.

    Use **Planning** to discuss the task and produce spec, plan, and handoff artifacts when needed. Move to **Todo** only when the issue is ready for agent execution.

    Before execution, read any generated documents under `docs/superpowers/` when present.

    ## Rework flow (required)

    When the Project **Status** is **Rework**:

    1. Read all injected recent discussion, issue comments, linked PR comments, reviews, and inline review threads before editing code.
    2. Find or create the `## Codex Workpad` comment. Summarize human feedback into acceptance criteria and a short rework plan before implementation.
    3. Sync each repo you touched with its integration branch.
    4. Implement fixes and add or update tests according to the touched repo's standards.
    5. Push and update the PR per repo; run the relevant validation commands; record results in the workpad **Validation** section.
    6. Move to **Human Review** only when feedback is addressed, tests pass, and PRs are open against the correct base.

    Do **not** ignore human comments that only appear on PRs. They are part of the rework scope.

    ## Tests and validation (mandatory)

    Symphony does **not** run test suites automatically. You must validate before **Human Review**.

    - Treat ticket `Validation`, `Test Plan`, or `Testing` sections as required; mirror them in the workpad.
    - Frontend (`frontend/`): run the repo's lint and unit test commands when frontend code changes.
    - Backend (`backend/`): run the repo's test command when backend code changes.
    - Goapi (`goapi/`): `make test` (or `make test-smart`) when goapi code changes.
    - Record in workpad **Validation**: `targeted tests: <command>` and outcome for each repo touched.
    - Do not move to **Human Review** until every touched repo has passing validation and an open PR against its base branch.
