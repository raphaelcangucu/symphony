description: "Gamba workspace — frontend (GambaLabs/frontend) + backend (GambaLabs/backend) + goapi (GambaLabs/goapi)."
dev_env_steps:
  # --- Frontend (Nuxt) ---
  - command: "yarn install"
    description: "Install frontend dependencies"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "frontend"
  - command: "NUXT_TELEMETRY_DISABLED=1 yarn dev -- --host 0.0.0.0"
    description: "Frontend Nuxt dev server"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "frontend"
  # --- Backend (Laravel Sail / Vibe) ---
  - command: "test -f .env || cp .env.example .env"
    description: "Create backend .env from example"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "test -x ./vendor/bin/sail || (docker run --rm --pull=always --platform linux/amd64 -v \"$(pwd)\":/opt -w /opt raphaelcangucu/php82sqlite3:latest bash -c \"composer install --ignore-platform-reqs && cp -n .env.example .env && php ./artisan sail:install --with=redis,pgsql,memcached,selenium,mailpit --no-interaction\" && ./vendor/bin/sail pull pgsql redis memcached selenium mailpit && ./vendor/bin/sail build)"
    description: "Bootstrap Sail (composer + sail:install + pull/build) when vendor/bin/sail missing"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "sudo chown -R \"$USER:$USER\" storage bootstrap/cache || true"
    description: "Fix storage/bootstrap/cache ownership after Docker/Sail (avoids permission denied in logs)"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "./vibe shared up"
    description: "Start shared Docker services (pgsql, redis, etc.)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "test -x ./vendor/bin/sail && ./vendor/bin/sail artisan migrate --seed || true"
    description: "Run backend migrations with seed data (when Sail is installed)"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "./vendor/bin/sail up -d --no-deps laravel.test"
    description: "Backend Laravel API (Sail app only; shared services via vibe)"
    optional: false
    port_env: "APP_PORT"
    primary: false
    ready_path: "/graphiql"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/graphiql"
    working_dir: "backend"
  # --- GoAPI (Go) ---
  - command: "test -f .env || cp .env.example .env"
    description: "Create goapi .env from example"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "goapi"
  - command: "make build-local || true"
    description: "Build GoAPI binary (fetches modules + compile check)"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "goapi"
  - command: "go run cmd/server/main.go"
    description: "GoAPI GraphQL server"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/graphiql"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/graphiql"
    working_dir: "goapi"
kind: "symphony_project"
metadata:
  exported_at: "2026-06-11T19:57:27Z"
  source_project_slug: "gamba"
name: "Gamba"
repositories:
  - clone_url: "https://github.com/GambaLabs/backend.git"
    default_branch: "dev"
    github_full_name: "GambaLabs/backend"
    role: "backend"
    selected_branch: "dev"
    workspace_path: "backend"
  - clone_url: "https://github.com/GambaLabs/frontend.git"
    default_branch: "development"
    github_full_name: "GambaLabs/frontend"
    role: "primary"
    selected_branch: "development"
    workspace_path: "frontend"
  - clone_url: "https://github.com/GambaLabs/goapi.git"
    default_branch: "dev"
    github_full_name: "GambaLabs/goapi"
    role: "service"
    selected_branch: "dev"
    workspace_path: "goapi"
setup:
  validation_commands:

  workflow_markdown: |
    ---
    agent:
      completion_transitions:
        In Progress: Human Review
        Merging: Done
        Rework: Human Review
        Todo: Human Review
      max_concurrent_agents: 5
      max_turns: 20
    assistant:
      draft_status: Backlog
    claude:
      command: symphony-claude
    codex:
      approval_policy: never
      command: codex --config shell_environment_policy.inherit=all app-server
      thread_sandbox: workspace-write
      turn_sandbox_policy:
        type: workspaceWrite
    dev_server:
      enabled: true
      idle_timeout_ms: 1800000
      port_range:
        - 4100
        - 4199
    evidence:
      required: true
      ui_paths:
        - "frontend/**"
      test_command:
        frontend: "yarn test --run"
        backend: "./vibe test"
        goapi: "go test ./..."
      e2e_command:
        frontend: "npx playwright test"
    hooks:
      after_create: |
        gh repo clone GambaLabs/frontend frontend -- --depth 1 -b development
        gh repo clone GambaLabs/backend backend -- --depth 1 -b dev
        gh repo clone GambaLabs/goapi goapi -- --depth 1 -b dev
    
        if [ -f frontend/.env.example ]; then
          cp frontend/.env.example frontend/.env
          cp frontend/.env.example frontend/.env.local
        else
          touch frontend/.env frontend/.env.local
        fi
    
        if [ -f backend/.env.example ] && [ ! -f backend/.env ]; then
          cp backend/.env.example backend/.env
        fi
    
        if [ -f goapi/.env.example ] && [ ! -f goapi/.env ]; then
          cp goapi/.env.example goapi/.env
        fi
    
        cat >> frontend/.env.local <<ENV
    
        # Symphony local/dev override for Nuxt/Vue frontend
        NODE_ENV=development
        NUXT_TELEMETRY_DISABLED=1
        APP_ENV=dev
        NUXT_PUBLIC_APP_ENV=dev
        NUXT_PUBLIC_API_URL=https://dev.gamba.com
        NUXT_PUBLIC_API_BASE=https://dev.gamba.com
        NUXT_PUBLIC_API_BASE_URL=https://dev.gamba.com
        NUXT_PUBLIC_BACKEND_URL=https://dev.gamba.com
        NUXT_PUBLIC_GOAPI_URL=https://dev.gamba.com
        API_URL=https://dev.gamba.com
        API_BASE=https://dev.gamba.com
        API_BASE_URL=https://dev.gamba.com
        BACKEND_URL=https://dev.gamba.com
        GOAPI_URL=https://dev.gamba.com
        ENV
    pr_monitor:
      done_on_merge: true
      enabled: true
      max_auto_rework: 2
    source_control:
      branch_pattern: "symphony/{issue}"
      pr_title_pattern: "{issue}: {title}"
      issue_marker_key: "Symphony-Issue"
    public_tunnel:
      base_domain: tracker.cods.dev
      enabled: true
    repositories:
      - github_full_name: GambaLabs/frontend
        role: primary
        selected_branch: development
        workspace_path: frontend
      - github_full_name: GambaLabs/backend
        role: backend
        selected_branch: dev
        workspace_path: backend
      - github_full_name: GambaLabs/goapi
        role: service
        selected_branch: dev
        workspace_path: goapi
    tracker:
      active_states:
        - Todo
        - In Progress
        - Rework
        - Merging
      field_states:
        - Backlog
        - Todo
        - In Progress
        - Human Review
        - Rework
        - Merging
        - Done
        - Cancelled
        - Duplicate
      terminal_states:
        - Done
        - Cancelled
        - Duplicate
      wait_states:
        - Human Review
    workspace:
      root: ~/code/gamba-workspaces
    ---
    
    You are working on GitHub issue `{{ issue.identifier }}` in the **Gamba** board (`GambaLabs/frontend`).
    
    Read and follow **`AGENTS.md`** in the workspace root and each repository's local guidance when present.
    
    Symphony injects **recent issue and PR comments** into your prompt when available. On **Rework**, those comments and the workpad define what you must do next.
    
    ## Repositories
    
    This is a **multi-repository** workspace. Issues and the Project board live on `GambaLabs/frontend`, but a single issue may require changes in frontend, backend, goapi, or any combination of them.
    
    | Repo | Path | Integration branch | PR base |
    |------|------|--------------------|---------|
    | `GambaLabs/frontend` (Vue/Nuxt frontend) | `frontend/` | `development` | `development` |
    | `GambaLabs/backend` (backend) | `backend/` | `dev` | `dev` |
    | `GambaLabs/goapi` (goapi) | `goapi/` | `dev` | `dev` |
    
    - Workspaces are cloned by `hooks.after_create` into `frontend/`, `backend/`, and `goapi/`.
    - The frontend is Vue/Nuxt, not Next. Do not copy assumptions from the Macro Markets frontend without checking Gamba's files first.
    - The frontend env is based on `frontend/.env.example`, written to both `frontend/.env` and `frontend/.env.local`; Symphony appends local overrides in `.env.local` so frontend API/backend/goapi routes point to `https://dev.gamba.com`.
    - Before handoff, sync each repo you touched with its integration branch:
      - frontend: `cd frontend && git fetch origin && git merge origin/development`
      - backend: `cd backend && git fetch origin && git merge origin/dev`
      - goapi: `cd goapi && git fetch origin && git merge origin/dev`
    - Open PRs **per repo against that repo's base**:
      - frontend: `cd frontend && gh pr create --base development --title "..."`
      - backend: `cd backend && gh pr create --base dev --title "..."`
      - goapi: `cd goapi && gh pr create --base dev --title "..."`
    - **Every PR body MUST include the association marker on its own line** so Symphony can link the PR to this issue deterministically: `Symphony-Issue: {{ issue.identifier }}`
    - Keep the machine-readable PR registry block in the `## Codex Workpad` comment updated with every PR you open (one item per PR, with repo, number, branch, url):
      ```
      <!-- symphony:prs
      - repo: GambaLabs/frontend
        number: 1866
        branch: symphony/{{ issue.identifier }}
        url: https://github.com/GambaLabs/frontend/pull/1866
      -->
      ```
    - On **Rework**, sync with the right integration branch per repo and address all issue comments, PR comments, and inline review threads.
    - Follow each repo's own test, lint, Docker/Sail/Vibe, and PR template conventions. Prefer repository-provided wrappers over bare tool invocations.
    
    ## Issue preview servers
    
    Symphony exposes a **Preview** tab when `dev_server.enabled` is true and DevEnv serve steps are saved for this project (imported via `gamba-project.yaml` → `dev_env_steps`).
    
    ### Preview modes
    
    | Mode | When to use | API target |
    |------|-------------|------------|
    | **UI-only** (default) | Frontend-only issues | `https://dev.gamba.com` (set in `hooks.after_create`) |
    | **Full stack** | Issues touching backend/goapi or needing local integration | Point `frontend/.env.local` at Symphony preview URLs for backend + goapi |
    
    ### How to run each service (manual or Preview tab)
    
    **Frontend — Nuxt (`frontend/`)**
    
    ```bash
    cd frontend
    yarn install
    yarn dev -- --host 0.0.0.0       # listens on $PORT (Symphony injects it in Preview)
    ```
    
    - Script in `package.json`: `nuxi dev --dotenv .env.local`
    - Env: copy from `.env.example` → `.env` + `.env.local`; Symphony appends dev overrides on clone
    - Validation: `yarn lint` and `yarn test`
    
    **Backend — Laravel Sail / Vibe (`backend/`)**
    
    First-time setup (Docker required):
    
    ```bash
    cd backend
    make install                     # composer + sail:install + pull/build images (once)
    ./vibe shared up                 # shared pgsql, redis, memcached, mailpit, etc.
    ./vendor/bin/sail artisan migrate --seed
    ```
    
    Start the API:
    
    ```bash
    cd backend
    ./vendor/bin/sail up -d          # Symphony sets APP_PORT before this in Preview
    # GraphQL playground: http://127.0.0.1:<APP_PORT>/graphiql
    ```
    
    Feature-branch isolation (optional, outside Symphony preview):
    
    ```bash
    ./vibe create branch=feature/slug
    cd ../vibe-feature-slug
    ./vibe up -d
    ./vibe artisan migrate --seed
    ```
    
    Prefer `./vibe` / `./vendor/bin/sail` over bare `php` or `artisan`. Validation: `./vendor/bin/sail pest` (or `./vibe test`).
    
    **GoAPI — Go (`goapi/`)**
    
    Prerequisites: Go ≥ 1.23.5, shared Postgres/Redis from backend Sail (`localhost:5432`, `localhost:6379`).
    Prefer **Makefile targets** over raw `go` commands (see `goapi/Makefile`).
    
    ```bash
    cd goapi
    cp .env.example .env             # DB_WRITE_URL → sail pgsql; PORT default 8091
    make build-local                 # optional: compile check + fetch modules
    make run-local                   # Symphony sets PORT in Preview (overrides .env)
    # GraphiQL: http://127.0.0.1:<PORT>/graphiql
    # GraphQL:  http://127.0.0.1:<PORT>/graphql
    ```
    
    Other useful Makefile targets:
    
    | Target | Purpose |
    |--------|---------|
    | `make run-local` | Start GraphQL server locally |
    | `make restart-local` | Kill process on :8091 and restart |
    | `make build-local` | Build `bin/server` |
    | `make test` | Run full test suite (`go test ./... -v`) |
    | `make test-smart` | Run tests with gotestsum (if installed) |
    | `make test-coverage` | Coverage report |
    | `make run-lambda-local` | SAM local API (Lambda path; needs SAM CLI) |
    
    Validation: `make test` (or `make test-smart` when gotestsum is available).
    
    ### Full-stack preview wiring
    
    When starting **Start Preview** with all three serve steps:
    
    1. Start **backend** and **goapi** first (they need `./vibe shared up` + Sail).
    2. Note the preview URLs from the Preview tab (or `http://127.0.0.1:<port>`).
    3. Update `frontend/.env.local` before starting the frontend serve step:
       ```
       NUXT_PUBLIC_API_URL=http://127.0.0.1:<backend-port>
       NUXT_PUBLIC_GOAPI_URL=http://127.0.0.1:<goapi-port>
       GRAPHQL_BASE_URL=http://127.0.0.1:<backend-port>/graphql
       ```
    4. Restart the frontend preview if it was already running.
    
    ### Saved DevEnv steps (imported)
    
    | Step | Role | Dir | Command |
    |------|------|-----|---------|
    | Install frontend deps | setup | `frontend/` | `yarn install` |
    | Nuxt dev server | serve (primary) | `frontend/` | `yarn dev -- --host 0.0.0.0` |
    | Backend .env | setup (optional) | `backend/` | `test -f .env \|\| cp .env.example .env` |
    | Backend install | setup (optional) | `backend/` | Sail bootstrap: `composer install` + `sail:install` + `sail pull/build` (see Makefile) |
    | Storage permissions | setup (optional) | `backend/` | `sudo chown -R $USER:$USER storage bootstrap/cache \|\| true` |
    | Shared Docker | setup | `backend/` | `./vibe shared up` |
    | Migrations | setup (optional) | `backend/` | `test -x ./vendor/bin/sail && ./vendor/bin/sail artisan migrate --seed \|\| true` |
    | Laravel API | serve | `backend/` | `./vendor/bin/sail up -d --no-deps laravel.test` |
    | GoAPI .env | setup (optional) | `goapi/` | `test -f .env \|\| cp .env.example .env` |
    | GoAPI build | setup (optional) | `goapi/` | `make build-local` |
    | GoAPI server | serve | `goapi/` | `make run-local` |
    
    Setup steps for the same `working_dir` run automatically before their serve step. Optional steps are skipped on failure.
    
    Repositories may also declare steps in `.symphony/devenv.yaml` for DevEnv discovery; imported project steps take precedence after import.
    
    ## Agent routing (GitHub labels)
    
    | Label | Agent |
    |-------|--------|
    | `symphony:codex` | Codex |
    | `symphony:claude` | Claude |
    | `symphony` | Default (**Codex** when this WORKFLOW includes `codex:`) |
    
    Symphony only dispatches issues whose label resolves to an agent configured above.
    
    Symphony reads and updates the GitHub Project **Status** field when moving cards.
    
    | State | Role |
    |-------|------|
    | Backlog | Out of scope; do not modify; wait for human to move to Todo |
    | Todo | Queue; move to In Progress before work |
    | In Progress | Active implementation |
    | Human Review | PR ready; poll for human decision; no further coding turns |
    | Rework | Address review feedback |
    | Merging | Merge approved PRs using the correct base per repo |
    | Done / Cancelled / Duplicate | Terminal |
    
    Use a single `## Codex Workpad` comment for progress. Blockers: `Blocked by #N` or `Depends on GambaLabs/frontend#N`.
    
    Raw GitHub GraphQL: `github_graphql`.
    
    ## Assistant authoring handoff
    
    The tracker **New issue** button opens the issue authoring assistant by default. It creates a draft in `assistant.draft_status`, then continues at `/projects/:slug/assistant/issue/:id`.
    
    Before execution, read any generated documents under `docs/superpowers/` when present.
    
    ## Rework flow (required)
    
    When the Project **Status** is **Rework**:
    
    1. Read all injected recent discussion, issue comments, linked PR comments, reviews, and inline review threads before editing code.
    2. Find or create the `## Codex Workpad` comment. Summarize human feedback into acceptance criteria and a short rework plan before implementation.
    3. Sync each repo you touched with its integration branch.
    4. Implement fixes and add or update tests according to the touched repo's standards.
    5. Push and update the PR per repo; run the relevant validation commands; record results in the workpad **Validation** section.
    6. Move to **Human Review** only when feedback is addressed, tests pass, and PRs are open against the correct base.
    
    Do **not** ignore human comments that only appear on PRs. They are part of the rework scope.
    
    ## Tests and validation (mandatory)
    
    Symphony does **not** run test suites automatically. You must validate before **Human Review**.
    
    - Treat ticket `Validation`, `Test Plan`, or `Testing` sections as required; mirror them in the workpad.
    - Frontend (`frontend/`): run the repo's lint and unit test commands when frontend code changes.
    - Backend (`backend/`): run the repo's test command when backend code changes.
    - Goapi (`goapi/`): `make test` (or `make test-smart`) when goapi code changes.
    - Record in workpad **Validation**: `targeted tests: <command>` and outcome for each repo touched.
    - Do not move to **Human Review** until every touched repo has passing validation and an open PR against its base branch.
