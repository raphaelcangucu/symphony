steps:
  - description: Symphony landing preview
    role: serve
    working_dir: .
    port_env: PORT
    primary: true
    url_path: /
    ready: http
    ready_path: /
    command: symphony-preview-runner
    run_spec:
      cwd: .
      prepare:
        - [npm, install]
      start:
        - [npm, run, dev, "--", "--host", "0.0.0.0", "--port", "${PORT}"]
      health:
        path: /
        timeout_ms: 120000
      stop:
        signal: TERM
        grace_ms: 5000
