description: "XIP Cash — Goravel API (xipcash/backend) + vinext admin (xipcash/admin) + Android/iOS wallets + site content."
kind: "symphony_project"
version: 2
slug: "xip"
name: "XIP"
repositories:
  - clone_url: "https://github.com/xipcash/backend.git"
    default_branch: "main"
    github_full_name: "xipcash/backend"
    role: "backend"
    selected_branch: "main"
    workspace_path: "backend"
  - clone_url: "https://github.com/xipcash/admin.git"
    default_branch: "main"
    github_full_name: "xipcash/admin"
    role: "frontend"
    selected_branch: "main"
    workspace_path: "admin"
  - clone_url: "https://github.com/xipcash/android.git"
    default_branch: "master"
    github_full_name: "xipcash/android"
    role: "mobile-android"
    selected_branch: "master"
    workspace_path: "android"
  - clone_url: "https://github.com/xipcash/ios.git"
    default_branch: "master"
    github_full_name: "xipcash/ios"
    role: "mobile-ios"
    selected_branch: "master"
    workspace_path: "ios"
  - clone_url: "https://github.com/xipcash/site.git"
    default_branch: "main"
    github_full_name: "xipcash/site"
    role: "content"
    selected_branch: "main"
    workspace_path: "site"
dev_env_steps:
  - command: "cp -n .env.example .env 2>/dev/null || true; docker compose up -d postgres; go mod download; ./artisan key:generate --force 2>/dev/null || true; ./artisan jwt:secret --force 2>/dev/null || true; ./artisan migrate --force"
    description: "Backend setup (.env, Postgres, deps, migrate)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "go run ."
    description: "Goravel API on $PORT"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/health"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "backend"
  - command: "npm ci && printf 'BACKEND_URL=http://127.0.0.1:3000\\n' > .env.local"
    description: "Admin setup (npm ci + .env.local)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "admin"
  - command: "npm run dev -- --port $PORT"
    description: "vinext admin on $PORT"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "admin"
setup:
  after_create_hook: |
    gh repo clone xipcash/backend backend -- --depth 1 -b main
    gh repo clone xipcash/admin admin -- --depth 1 -b main
    gh repo clone xipcash/android android -- --depth 1 -b master
    gh repo clone xipcash/ios ios -- --depth 1 -b master
    gh repo clone xipcash/site site -- --depth 1 -b main
  scan_summary:
    restored_from: "GitHub Project xipcash/projects/3"
  validation_commands:
    - "cd backend && go test ./tests -count=1 2>/dev/null || go test ./... -count=1"
    - "cd admin && npm run lint && npm run typecheck && npm run test"
    - "cd android && ./gradlew test"
  workflow_markdown: |
    ---
    agent:
      completion_transitions:
        In Progress: In Review
        Todo: In Review
      max_concurrent_agents: 5
      max_turns: 40
    assistant:
      draft_status: Todo
    codex:
      approval_policy: never
      command: codex --config shell_environment_policy.inherit=all app-server
      thread_sandbox: danger-full-access
      turn_sandbox_policy:
        type: dangerFullAccess
    dev_server:
      enabled: true
      idle_timeout_ms: 1800000
      port_range:
        - 4300
        - 4399
    pr_monitor:
      done_on_merge: true
      enabled: true
      max_auto_rework: 2
    source_control:
      branch_pattern: "symphony/{issue}"
      issue_marker_key: "Symphony-Issue"
      pr_title_pattern: "{issue}: {title}"
    tracker:
      active_states:
        - Todo
        - In Progress
      dispatch_states:
        - Todo
      field_states:
        - Todo
        - In Progress
        - In Review
        - Done
        - Resources
      terminal_states:
        - Done
      wait_states:
        - In Review
    workspace:
      root: ~/code/xip-workspaces
    ---

    You are working on issue `{{ issue.identifier }}` in the **XIP** board.

    **Canonical issue (source of truth):** {{ issue.url }}

    The owning GitHub repository is determined by that URL (e.g. `xipcash/backend`, `xipcash/admin`, `xipcash/android`, `xipcash/ios`, or `xipcash/site`).
    Do **not** assume every issue lives in `xipcash/admin` — the board aggregates issues from multiple repos.

    Read **`CLAUDE.md`** in each repository you touch.

    ## Tracker / issue metadata (local-first)

    - Use Symphony's issue-bound tools first: `set_issue_status`, `list_comments`, `add_comment`, `update_comment`.
    - Derive the GitHub repo from `{{ issue.url }}`, not from `tracker.config.repo`.

    ## Creating tasks (multi-repo — required)

    This project uses a **single GitHub Project** with issues filed in **different repositories**.

    Before `create_issue` or `create_draft_issue`:

    1. Call `list_project_repositories`.
    2. Choose the **owning repo** for the task.
    3. Pass `repository: "owner/name"` on create (Symphony resolves the issue in that repo, then adds it to the project).

    | Work type | Repository | Suggested label |
    |-----------|------------|-----------------|
    | API, auth, payments, emails, admin-api | `xipcash/backend` | `area:backend` |
    | Admin UI, settings, dashboard, e2e | `xipcash/admin` | `area:admin` |
    | Android wallet (NFC, BLE, QR, POS) | `xipcash/android` | `area:android` |
    | iOS wallet (NFC, BLE) | `xipcash/ios` | `area:ios` |
    | Public site content (legacy; migrating to admin) | `xipcash/site` | — |

    `area:*` labels can infer the repository when linked repos are configured, but **explicit `repository` is preferred**.

    ## Repositories

    | Repo | Path | Base branch | PR base |
    |------|------|-------------|---------|
    | `xipcash/backend` (Goravel API) | `backend/` | `main` | `main` |
    | `xipcash/admin` (vinext admin) | `admin/` | `main` | `main` |
    | `xipcash/android` (Kotlin wallet) | `android/` | `master` | `master` |
    | `xipcash/ios` (Swift wallet) | `ios/` | `master` | `master` |
    | `xipcash/site` (static content) | `site/` | `main` | `main` |

    - Open PRs **per repo** against that repo's base branch.
    - Every PR body MUST include: `Symphony-Issue: {{ issue.identifier }}`
    - Cross-repo work (e.g. admin#4 depends on backend#2): file issues in the correct owning repo; link dependencies in the workpad.

    ## Mobile notes

    - **Android:** `./gradlew assembleCiDebug` / `./gradlew test`; NFC needs `app/src/main/assets/local.properties` (Alchemy key).
    - **iOS:** requires **macOS + Xcode** to build/simulate; code edits are valid in WSL but build verification needs Mac/CI.
    - **BLE/NFC cross-platform:** changes may require both `android/` and `ios/` — verify both sides.

    ## Backend + admin preview

    | Step | Service | Dir |
    |------|---------|-----|
    | 1–2 | Goravel API | `backend/` |
    | 3–4 | vinext admin (primary preview) | `admin/` |

    Admin consumes `/admin/api` on the backend. Set `BACKEND_URL` / `NEXT_PUBLIC_API_URL` to the local backend port.

    ## Workflow states (GitHub Project Status)

    | Status | Role |
    |--------|------|
    | Todo | Orchestrator queue |
    | In Progress | Active implementation |
    | In Review | Human review — no coding turns |
    | Done | Terminal |
    | Resources | Reference / docs — not auto-dispatched |

    Use a single `## Codex Workpad` comment for progress. Blockers: `Depends on xipcash/backend#N` (use canonical repo from the target issue URL).

    ## Tests and validation

    - **backend:** scoped `go test ./tests -run TestName` (avoid full suite unless required)
    - **admin:** `npm run lint`, `npm run typecheck`, `npm run test`; e2e via `npm run test:e2e` when UI changed
    - **android:** `./gradlew test` for touched modules
    - **ios:** unit tests on macOS when available

    Record results in workpad **Validation** before moving to **In Review**.
tracker:
  kind: "github"
  config:
    owner_kind: "organization"
    project_number: 3
    project_id: "PVT_kwDODzf7W84BO2m1"
    project_url: "https://github.com/orgs/xipcash/projects/3"
    repo: "xipcash/admin"
    status_field: "Status"
workflow_statuses:
  - category: "unstarted"
    is_terminal: false
    name: "Todo"
    position: 0
  - category: "started"
    is_terminal: false
    name: "In Progress"
    position: 1
  - category: "started"
    is_terminal: false
    name: "In Review"
    position: 2
  - category: "completed"
    is_terminal: true
    name: "Done"
    position: 3
  - category: "backlog"
    is_terminal: false
    name: "Resources"
    position: 4
metadata:
  exported_at: "2026-06-24T00:00:00Z"
  source_project_slug: "xip"
