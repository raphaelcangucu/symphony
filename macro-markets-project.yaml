description: "Macro Markets workspace — Next.js frontend (clouapp/front) + Laravel backend (clouapp/back)."
dev_env_steps:
  - command: "npm ci"
    description: "Install front dependencies"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "front"
  - command: "docker run --rm --entrypoint bash -v \"$PWD\":/var/www/html -w /var/www/html sail-8.5/app -lc \"composer install --no-interaction --no-progress\""
    description: "Install back dependencies (composer, in container)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "back"
  - command: "npm run dev"
    description: "Front dev server (Next.js)"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/"
    ready_probe: "tcp"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "front"
  - command: "docker compose up laravel.test"
    description: "Back dev server (Laravel/Docker)"
    optional: false
    port_env: "APP_PORT"
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "serve"
    source: "manual"
    url_path: "/admin"
    working_dir: "back"
