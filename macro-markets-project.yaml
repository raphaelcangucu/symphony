description: "Macro Markets workspace — Next.js frontend (clouapp/front) + Laravel backend (clouapp/back)."
dev_env_steps:
  # --- Backend (Laravel Sail) — must start before the frontend ---
  - command: "bash .symphony/setup.sh"
    description: "Backend setup (.env + build sail-8.5 image + composer install)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "back"
  - command: "bash .symphony/serve.sh"
    description: "Backend Laravel API (docker compose up on $PORT + restore dumps + migrate + /health)"
    optional: false
    port_env: "PORT"
    primary: false
    ready_path: "/health"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/graphiql"
    working_dir: "back"
  # --- Frontend (Next.js) — wired to the backend after it is healthy ---
  - command: "bash .symphony/setup.sh"
    description: "Frontend setup (.env.local + npm ci)"
    optional: false
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "front"
  - command: "bash .symphony/serve.sh"
    description: "Frontend Next.js dev (wire backend, then serve on $PORT)"
    optional: false
    port_env: "PORT"
    primary: true
    ready_path: "/api/health"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "front"
