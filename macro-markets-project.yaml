        # TURNSTILE
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
        NEXT_PRIVATE_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
    
        # MEILISEARCH
        NEXT_PUBLIC_MEILISEARCH_BASE_URL=http://localhost:9115
