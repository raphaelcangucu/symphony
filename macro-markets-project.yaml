        cat > front/.env.local <<ENV
        # Local ------------------------------------------------------------------------------------------- #
        # APP
        APP_ENV=dev
        NEXT_PUBLIC_DEFAULT_LANGUAGE=en
        NEXT_PUBLIC_ENABLE_PERSISTED_QUERIES=true
    
        # GRAPHQL
        NEXT_PUBLIC_API_URL=https://acp.macro.markets
