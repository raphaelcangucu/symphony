# Advising project bundle (Jira CDE, Product = Inspire) + civitaslearning/advising.
#
# This is a DRAFT template. Two values must be confirmed against live Jira before
# importing (see docs/superpowers/plans/2026-06-11-jira-board-filter.md, Task 6):
#
#   1) Product field JQL reference. `fields: {Product: Inspire}` compiles to
#      project = "CDE" AND "Product" = "Inspire". This works only if the custom
#      field name "Product" is unique/queryable in the site. If a probe search
#      (POST /rest/api/3/search/jql with that JQL) returns 400 "Field 'Product'
#      does not exist", remove `fields` and use the `jql` form with the field id:
#         GET /rest/api/3/field  ->  find name == "Product"  ->  cf[<id>]
#         jql: 'cf[<id>] = "Inspire"'
#
#   2) Workflow statuses. Replace the `workflow_statuses` list and the
#      active_states / terminal_states in workflow_markdown with the REAL CDE
#      statuses from GET /rest/api/3/project/CDE/statuses (category mapping:
#      new -> unstarted, indeterminate -> started, done -> completed).
#
# Import:  make project-import FILE=advising-project.yaml
#   (or)   SymphonyElixir.LocalTracker.Projects.import_yaml(File.read!("advising-project.yaml"))
#
# Dispatch safety: keep Settings -> orchestrator require_assignee_match and
# require_symphony_label ON (defaults). The board shows all Product=Inspire
# issues (incl. colleagues') for visibility, but only YOUR assigned, symphony:*-
# labeled issues are ever auto-started.
kind: symphony_project
version: 2
slug: advising
name: Advising
description: "Civitas Advising — Jira CDE (Product = Inspire) + civitaslearning/advising."
tracker:
  kind: jira
  config:
    project_key: CDE
    fields:
      Product: Inspire
    # Also pull issues linked to an in-scope (Product=Inspire) issue — e.g. a bug
    # subtask of, or a clone of, an Inspire story that itself lacks the Product
    # field — so they still show on the board. One hop; same project only.
    include_linked_issues: true
    # Linked-issue expansion roughly doubles the pulled set (every in-scope story
    # drags in its subtasks/links), so raise the cap above the 500 default to
    # avoid clipping linked work. Sized with headroom over the current ~760.
    max_results: 1500
    # Optional: Jira board id for column order during first sync (before YAML import).
    # board_id: <CDE board id from GET /rest/agile/1.0/board?projectKeyOrId=CDE>
    # If "Product" is not directly queryable by name, drop `fields` above and use:
    # jql: 'cf[<PRODUCT_FIELD_ID>] = "Inspire"'
    # order_by: "created DESC"   # optional
repositories:
  # default_branch / selected_branch: Symphony publish gate uses these when the clone
  # lacks origin/HEAD (common in ephemeral workspaces). Must match the PR base branch.
  - github_full_name: civitaslearning/advising
    clone_url: git@github.com:civitaslearning/advising.git
    default_branch: pre-release
    selected_branch: pre-release
    role: primary
    workspace_path: advising
workflow_statuses:
  # Column order matches the CDE Jira board (left -> right).
  # Backlog is the intake column; Selected for Development is the orchestrator dispatch queue.
  - { name: "Backlog", category: "unstarted", position: 0, is_terminal: false }
  - { name: "BLOCKED BY CUSTOMER", category: "started", position: 1, is_terminal: false }
  - { name: "Selected for Development", category: "unstarted", position: 2, is_terminal: false }
  - { name: "Em andamento", category: "started", position: 3, is_terminal: false }
  - { name: "READY FOR QA", category: "started", position: 4, is_terminal: false }
  - { name: "IN QA", category: "started", position: 5, is_terminal: false }
  - { name: "Revisão de pares", category: "started", position: 6, is_terminal: false }
  - { name: "Ready for Deploy", category: "started", position: 7, is_terminal: false }
  - { name: "CUSTOMER APPROVAL", category: "started", position: 8, is_terminal: false }
  - { name: "Done", category: "completed", position: 9, is_terminal: true }
  - { name: "Concluído", category: "completed", position: 10, is_terminal: true }
  - { name: "Won't Do", category: "completed", position: 11, is_terminal: true }
dev_env_steps:
  # Script-based preview, committed in the repo under advising/.symphony/. The
  # scripts pin a per-workspace Compose project (so previews coexist), keep the
  # shared singletons (postgres/memcached/localstack) in the global "docker"
  # project, and gate readiness on the app's existing GET /health endpoint.
  - command: "bash .symphony/setup.sh"
    description: "Preview setup: docker/.env, ECR login (best-effort), Playwright browser"
    optional: true
    primary: false
    ready_path: "/"
    ready_probe: "tcp"
    role: "setup"
    source: "manual"
    url_path: "/"
    working_dir: "advising"
  - command: "bash .symphony/serve.sh"
    description: "Inspire web app (PHP 7.4 Docker) — boots stack, waits on /health"
    optional: false
    port_env: "INSPIRE_PORT"
    primary: true
    ready_path: "/health"
    ready_probe: "http"
    role: "serve"
    source: "manual"
    url_path: "/"
    working_dir: "advising"
setup:
  workflow_markdown: |
    ---
    evidence:
      required: true
      repos:
        # Single git clone (`advising/`). Manifest `repo` values must use this key,
        # not subfolder names like `graphql` or `accessible-ui`.
        advising:
          unit_command: "./vibe test"
          ui_paths:
            - "advisestream/web/**"
            - "accessible-ui/**"
            - "kiosk/**"
          e2e:
            command: "cd automation/playwright && npx playwright test"
    agent:
      max_turns: 20
    codex:
      approval_policy: never
      thread_sandbox: danger-full-access
      turn_sandbox_policy:
        type: dangerFullAccess
    dev_server:
      enabled: true
      port_range:
        - 4300
        - 4399
      idle_timeout_ms: 1800000
      auto_start_on: pull_request,human_review
    public_tunnel:
      base_domain: tracker.cods.dev
      enabled: true
    hooks:
      after_create: |
        # Prefer gh (SSH per `gh config`) or git+SSH — not the Codex GitHub app connector.
        gh repo clone civitaslearning/advising advising -- --depth 1 -b pre-release

        if [ -f advising/docker/.env.example ] && [ ! -f advising/docker/.env ]; then
          cp advising/docker/.env.example advising/docker/.env
        fi
    tracker:
      field_states:
        - Backlog
        - BLOCKED BY CUSTOMER
        - Selected for Development
        - Em andamento
        - READY FOR QA
        - IN QA
        - Revisão de pares
        - Ready for Deploy
        - CUSTOMER APPROVAL
        - Done
        - Concluído
        - Won't Do
      active_states:
        - Selected for Development
        - Em andamento
      dispatch_states:
        - Selected for Development
      wait_states:
        - Revisão de pares
      terminal_states:
        - Concluído
        - Won't Do
        - Done
    source_control:
      branch_pattern: "symphony/{issue}"
      pr_title_pattern: "{issue}: {title}"
      issue_marker_key: "Symphony-Issue"
    workspace:
      root: ~/code/advising-workspaces
    ---

    You are working on Jira issue `{{ issue.identifier }}` in the **Advising** board
    (Jira project `CDE`, scoped to Product `Inspire`).

    Repository: `civitaslearning/advising` (workspace path `advising/`), integration
    branch and PR base `pre-release`.

    Read `docs/SAIL.md`, `docs/VIBE.md`, `docs/TESTS.md`, and `docs/INSTALL.md` in
    the repo before running commands. This is **PHP 7.4 Symfony 1.x** (legacy Inspire)
    running in Docker — never run bare `php` on the host for app code.

    ## Execution order (Symphony)

    Work in this order unless the ticket is a legitimate no-op:

    1. **Plan** — create/update the `## Codex Workpad` (plan + acceptance criteria).
    2. **Implement** — code changes, commits, push, open/update the PR (`push` skill).
    3. **Validate** — only when implementation is ready for handoff: run tests, capture
       artifacts, write `.symphony/evidence/manifest.json` (`evidence` skill).

    Do **not** start a fresh run by reading the `evidence` skill or running the full
    validation matrix. Targeted tests while coding are fine; the VALIDATE gate runs at
    run completion, not at dispatch.

    On **resume**, finish missing implementation/PR work first. Retry blocked validation
    commands from the workpad only after the ticket change set is complete.

    ## Git / GitHub

    Use **shell `git` and `gh`** for clone, fetch, push, and PRs. This machine has
    GitHub SSH (`git@github.com`) and `gh auth` configured (`gh` uses SSH for git ops).

    - Clone/fetch/push: `git` / `gh repo clone` / `gh pr view` / `gh pr create`
    - **Do not** use the Codex GitHub app connector (`codex_apps`, `github_search_*`,
      `github_get_pr_info`, etc.) for `civitaslearning/*` — that integration is not
      installed on the private org and returns 404/422. Use `gh` and `git` instead.
    - Symphony tracker API tools (`github_graphql`, etc.) use the server `GITHUB_TOKEN`
      (same token as `gh auth token`).

    ## Runtime (Docker + Sail + Vibe)

    | Concern | Path | Notes |
    |---------|------|-------|
    | Main app (PHP 7.4) | `advisestream/` | Symfony 1.x LAMP stack, mounted at `/opt/inspire` in container |
    | Accessible UI (React) | `accessible-ui/` | MUI portals spliced into Inspire |
    | Kiosk (React) | `kiosk/` | Kiosk app |
    | E2E automation | `automation/playwright/` | Playwright suite (needs running app) |

    **Sail** (`./sail` → `scripts/sail`): Docker CLI for the main repo. Runs PHPUnit,
    Symfony tasks, and shell commands inside the `inspire` container.

    **Vibe** (`./vibe` → `scripts/vibe`): Git worktree manager. Each Symphony issue
    workspace acts like a vibe — isolated app containers, **shared** postgres /
    memcached / localstack across worktrees.

    ### Startup (required before tests or manual QA)

    ```bash
    cd advising
    ./vibe shared up          # postgres, memcached, localstack (once)
    ./vibe up                 # inspire + accessible-ui + kiosk
    ./vibe status             # confirm ports
    ```

    First-time setup may also need AWS ECR login (`./sail aws:login`) and
    `docker/.env` credentials — see `docs/INSTALL.md`.

    ### Tests by touched area (run from `advising/` unless noted)

    | Area changed | Command |
    |--------------|---------|
    | PHP / Symfony (`advisestream/`) | `./vibe test` or `./vibe test --filter=ClassName` |
    | Go GraphQL API (`graphql/`) | `cd graphql && go test ./...` |
    | Accessible UI (`accessible-ui/`) | `cd accessible-ui && yarn test --runInBand --watchAll=false` |
    | Kiosk (`kiosk/`) | `cd kiosk && yarn test` |

    During implementation, run **targeted** tests for the files you touched. Do not
    run the full matrix until handoff.

    ### VALIDATE handoff (mandatory before Human Review)

    When the PR is ready, start Docker if needed (`./vibe shared up`, `./vibe up`), then
    follow the `evidence` skill:

    - Run every applicable command from the table above for paths you changed.
    - When UI paths changed, also run Playwright (`cd automation/playwright && npx playwright test`).
    - Copy outputs to `.symphony/evidence/artifacts/`.
    - Write `.symphony/evidence/manifest.json` with `"repo": "advising"` on every run row
      (this monorepo is one git repo; do not use subfolder names as `repo`).

    ## Issue preview (Symphony Preview tab)

    Preview is **script-based**, committed in the repo under `advising/.symphony/`
    (`devenv.yaml` mirrors the steps; see `.symphony/README.md`). The tracker
    **Preview** tab starts them on demand or auto-starts on `pull_request` /
    `human_review`. Two steps:

    1. `bash .symphony/setup.sh` — ensures `docker/.env`, best-effort ECR login,
       installs the Playwright preview browser. Idempotent, never fatal.
    2. `bash .symphony/serve.sh` (primary) — boots the app, discovers the published
       port, and waits for `GET /health` before staying in the foreground.

    - Symphony allocates `INSPIRE_PORT` and `serve.sh` runs `./vibe up` inside Docker.
    - Each workspace runs under its own `COMPOSE_PROJECT_NAME` (resolved to the
      workspace/worktree name) so app containers never collide across issues.
      `scripts/vibe` + `scripts/sail` honor that project for the app stack and for
      `./vibe <cmd>` exec (e.g. `phpunit`); the shared singletons
      (postgres/memcached/localstack) stay pinned to the global `docker` project.
    - Readiness uses the app's own `GET /health` (the same endpoint the K8s probes
      hit), so the **Preview** tab goes ready only once the app actually serves.
    - **Prerequisite**: AWS ECR login (`./sail aws:login`) and valid `docker/.env` on
      the host running Symphony — see `docs/INSTALL.md`.

    Manual preview from the workspace:

    ```bash
    cd advising
    bash .symphony/setup.sh                 # once
    bash .symphony/serve.sh                 # boots app, waits on /health, blocks
    # in another shell:
    bash .symphony/verify-health.sh         # project/port/health diagnostics
    ```

    `serve.sh` writes the resolved port to `.symphony/preview-port` and exports
    `PLAYWRIGHT_BASE_URL`. Preview smoke (full screenshot/video/trace capture):

    ```bash
    cd advising/automation/playwright
    npm run playwright:preview              # uses playwright.preview.config.js
    ```

    Tenant URLs (when app is ready): `http://cwu.localhost:<port>/`, etc.

    ## Workflow

    Status contract (orchestrator + agent):

    - **Selected for Development**: queue; Symphony auto-dispatches here. On your first turn, call `set_issue_status` to move to **Em andamento** before coding.
    - **Em andamento**: active implementation.
    - **Revisão de pares**: PR ready for human review (move here when handoff is complete).
    - **READY FOR QA** / **IN QA** / **Ready for Deploy**: post-review pipeline (humans or QA move these).
    - **Concluído**: done.

    - Sync before handoff: `cd advising && git fetch origin && git merge origin/pre-release`.
    - Open the PR against `pre-release`:
      `cd advising && gh pr create --base pre-release --title "{{ issue.identifier }}: ..."`.
    - **Every PR body MUST include the association marker on its own line** so Symphony
      links the PR to this issue deterministically: `Symphony-Issue: {{ issue.identifier }}`.
    - Use a single `## Codex Workpad` comment for progress and the machine-readable
      `symphony:prs` registry block.
    - Record validation in the workpad under **Validation**, after implementation is done:
      `targeted tests: <command>` and outcome.

    Follow the repository's own test, lint, and PR-template conventions. Move the card
    to **Revisão de pares** only after implementation, PR, and VALIDATE evidence are complete.
