name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify focused quality gates
        run: make ci-fast

      - name: Run bounded mobile host validation
        run: |
          set -a
          [ -f .env.testing ] && . ./.env.testing
          set +a
          mix test \
            test/symphony_elixir/mobile_rpc \
            test/symphony_elixir/settings/vault_test.exs \
            test/symphony_elixir/extensions_test.exs \
            test/symphony_elixir_web/mobile_rpc_socket_test.exs \
            test/symphony_elixir_web/controllers/tracker/mobile_rpc_controller_test.exs \
            test/symphony_elixir_web/controllers/tracker/mobile_push_controller_test.exs

      - name: Install benchmark dependencies
        run: npm ci --ignore-scripts --prefix ../benchmarks/landing-page-agent-comparison

      - name: Verify benchmark harness
        run: npm test --prefix ../benchmarks/landing-page-agent-comparison
